<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Skills123 · 技能包导航</title>
  <meta name="description" content="按开发、研究、运营与内容分组，查找 AI 技能包和包内技能。">
  <link rel="canonical" href="https://skills123.cc/">
  <meta property="og:title" content="Skills123 · 技能包导航">
  <meta property="og:description" content="搜索技能包和具体技能，进入统一技能工作台。">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="/assets/css/site.css">
  <link rel="stylesheet" href="/assets/css/package-navigation.css">
</head>
<body>
  <div class="package-index-shell">
    <header class="site-header">
      <a class="brand" href="/"><span class="mark">S</span>Skills123</a>
      <nav class="nav" aria-label="主导航">
        <strong>技能包</strong>
        <span>学习路径</span>
        <span>关于</span>
      </nav>
    </header>

    <main>
      <section class="package-index-intro">
        <div>
          <p class="eyebrow">SKILL PACKAGE INDEX</p>
          <h1>选择一个技能包，进入工作台。</h1>
        </div>
        <p>技能包把相关技能组织成可搜索、可筛选、可连续使用的工作界面。也可以直接搜索具体技能。</p>
      </section>

      <form class="catalogue-search" id="catalogue-search-form" role="search">
        <label class="catalogue-search-label" for="catalogue-query">全局技能搜索</label>
        <input id="catalogue-query" type="search" placeholder="搜索技能包、技能或 /command" autocomplete="off">
        <button type="submit">搜索</button>
      </form>

      <section class="catalogue-results" id="catalogue-results" aria-live="polite" hidden>
        <div class="result-heading">
          <div><p class="eyebrow">SEARCH RESULTS</p><h2>搜索结果</h2></div>
          <p><strong id="result-count">0</strong> 项匹配</p>
        </div>
        <div id="package-results"></div>
        <div id="skill-results"></div>
        <div class="catalogue-no-results" id="catalogue-no-results" hidden>
          <strong>没有找到匹配内容</strong>
          <p>尝试更短的名称、用途关键词或 slash command。</p>
          <button type="button" id="clear-catalogue-search">清除搜索</button>
        </div>
      </section>

      <div class="package-group-index" id="package-group-index" aria-busy="true"></div>
    </main>

    <footer class="site-footer">Skills123 · 以技能包组织可连续使用的 AI 工作技能</footer>
  </div>
  <script type="module" src="/assets/js/package-navigation.js?v=20260721-2"></script>
</body>
</html>
